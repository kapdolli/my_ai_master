name: Deploy 수시 페이지

# GitHub Actions runner (US IP)는 진학사/유웨이 사이트에서 60% 대학이
# 차단되므로, 스크래핑은 로컬에서 돌리고 (services/susi_competition/refresh_all.ps1)
# Actions 는 로컬이 push한 HTML/CSV 를 GitHub Pages 로 배포만 한다.

on:
  push:
    branches: [main]
    paths:
      - "services/susi_competition/susi_2027_top50.html"
      - "services/susi_competition/version.json"
      - "services/susi_competition/*.csv"
      - ".github/workflows/refresh.yml"
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble _site/
        run: |
          mkdir -p _site
          if [ -f services/susi_competition/susi_2027_top50.html ]; then
            cp services/susi_competition/susi_2027_top50.html _site/index.html
          else
            echo "<h1>Not yet generated. Run refresh_all.ps1 locally.</h1>" > _site/index.html
          fi
          cp services/susi_competition/*.csv _site/ 2>/dev/null || true
          # 열려 있는 페이지가 갱신 여부만 가볍게 확인하는 파일
          cp services/susi_competition/version.json _site/ 2>/dev/null || true
          ls -la _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
